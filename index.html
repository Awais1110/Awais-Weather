<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awais Weather</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="black"></div>
    <video autoplay muted loop playsinline id="bg-video">
      <source
        src="https://cdn.pixabay.com/video/2017/03/20/8451-209292190_large.mp4"
        type="video/mp4"
      />
    </video>
    <header>
      <h4>Awais Weather</h4>
    </header>
    <main>
      <div class="search-input">
        <img src="Images/search-01-stroke-rounded.png" alt="" width="25px" />
        <input type="text" placeholder="Search for a city..." />
        <button class="s-btn">Search</button>
      </div>
      <div class="city-info">
        <h1 class="city">City not found!</h1>

        <div class="date-badge">
          <time id="live-date"></time>
        </div>
        <!-- <h6>Monday, November 11</h6> -->

        <img src="Images/w-icon (4).png" alt="" width="250px" />
      </div>
      <div class="temp-info">
        <h1 class="temp"></h1>
        <h3>Cloudy</h3>
        <!-- <p class="feels"></p> -->
      </div>

      <div class="all-info">
        <div class="info-card">
          <img src="Images/w-icon (7).png" alt="" width="35px" />
          <p>Feels Like</p>
          <h3 class="feels"></h3>
        </div>
        <div class="info-card">
          <img src="Images/w-icon (3).png" alt="" width="31px" />
          <p>Humidity</p>
          <h3 class="humidity"></h3>
        </div>
        <div class="info-card">
          <img src="Images/w-icon (5).png" alt="" width="35px" />
          <p>Wind Speed</p>
          <h3 class="winds"></h3>
        </div>
        <div class="info-card">
          <img src="Images/w-icon (4).png" alt="" width="70px" />
          <p>Cloud Coverage</p>
          <h3 class="clouds"></h3>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
